<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireBlog</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="js/blogs.js" defer></script>
  <script src="js/index.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="brand">FireBlog</a>
    </div>
  </header>

  <main class="site-main">
    <header class="hero-brand">
      <h1 class="hero-brand__name">Fire<span>Blog</span></h1>
      <hr class="divider--light">
      <p class="hero-brand__tag">前端／Firebase／實作</p>
    </header>

    <div class="page-shell">
      <div id="blogCardsContainer" class="post-list"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="index.html" class="brand">FireBlog</a>
      <p class="site-footer__copy">© 2024 FireBlog. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
