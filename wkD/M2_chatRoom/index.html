<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fire Chat</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,500&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Serif&display=swap">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.3.1/css/all.css"
    integrity="sha384-mzrmE5qonljUremFsqc01SB46JvROS7bZs3IO2EmfFsd15uHvIt+Y8vEf7N7fWAU" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">

  <script type="module" src="./js/script.js"></script>
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-sm-10 col-md-8 col-lg-6 mx-auto">
        <div class="card shadow mt-5">
          <div id="card-header" class="card-header text-center">FIRE CHAT</div>
          <input type="text" class="form-control-plaintext name-field" id="name-field"
            placeholder="Enter a username ...">
          <div class="card-body">
            <ul id="message-list" class="message-list"></ul>
          </div>
          <div class="card-footer text-muted">
            <input type="text" class="form-control-plaintext message-field" id="message-field"
              placeholder="Type a message ...">
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
