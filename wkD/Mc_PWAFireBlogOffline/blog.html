<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章 - FireBlog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#00979c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FireBlog">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-storage-compat.js" defer></script>
  <script src="js/firebaseConfig.js" defer></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/blog.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="brand">FireBlog</a>
      <button type="button" id="mobileMenuBtn" class="nav-toggle" aria-label="開啟選單">☰</button>
      <nav id="navbarNav" class="nav-links" aria-label="主要">
        <button type="button" id="installBtn" class="install-btn" hidden>安裝 App</button>
        <a href="upload.html">管理</a>
      </nav>
    </div>
  </header>
  <p id="installHint" class="install-hint" hidden role="status">若未出現安裝按鈕，請使用瀏覽器選單的「安裝 FireBlog」</p>
  <div id="offlineBanner" class="offline-banner" hidden role="status">目前離線：顯示已快取內容</div>

  <main class="site-main">
    <div id="loadingIndicator" class="loading-block">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>載入文章中…</p>
    </div>

    <div id="errorMessage" class="alert is-hidden">
      <span id="errorText"></span>
    </div>

    <div id="blogContent" class="is-hidden">
      <div id="blogImageContainer" class="article-hero"></div>
      <article class="article-body">
        <a href="index.html" class="article-back">← 全部文章</a>
        <span id="blogCategory" class="article-category is-hidden"></span>
        <h1 id="blogTitle" class="article-title"></h1>
        <hr class="divider--dark">
        <p class="article-meta">
          <span id="blogAuthor"></span>
          <span aria-hidden="true"> · </span>
          <span id="blogDate"></span>
        </p>
        <div id="blogContentText" class="article-content"></div>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="index.html" class="brand">FireBlog</a>
      <p class="site-footer__copy">© 2024 FireBlog. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
