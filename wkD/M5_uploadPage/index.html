<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireBlog</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js" defer></script>
  <script src="js/firebaseConfig.js" defer></script>
  <script src="js/index.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="brand">FireBlog</a>
      <button type="button" id="mobileMenuBtn" class="nav-toggle" aria-label="開啟選單">☰</button>
      <nav id="navbarNav" class="nav-links" aria-label="主要">
        <a href="upload.html">上傳</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <header class="hero-brand">
      <h1 class="hero-brand__name">Fire<span>Blog</span></h1>
      <hr class="divider--light">
      <p class="hero-brand__tag">前端／Firebase／實作</p>
    </header>

    <div class="page-shell">
      <div id="loadingIndicator" class="loading-block">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>載入文章中…</p>
      </div>
      <div id="blogCardsContainer" class="post-list"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="index.html" class="brand">FireBlog</a>
      <p class="site-footer__copy">© 2024 FireBlog. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
