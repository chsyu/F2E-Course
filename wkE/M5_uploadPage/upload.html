<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上傳 - SupaBlog</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../_supabase/supabaseConfig.js" defer></script>
  <script src="js/upload.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="brand">SupaBlog</a>
      <button type="button" id="mobileMenuBtn" class="nav-toggle" aria-label="開啟選單">☰</button>
      <nav id="navbarNav" class="nav-links" aria-label="主要">
        <a href="upload.html">上傳</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    <header class="hero-brand">
      <h1 class="hero-brand__name">上傳</h1>
      <hr class="divider--light">
      <p class="hero-brand__tag">Supabase</p>
    </header>

    <div class="page-shell">
      <section class="cms-panel" style="max-width: 32rem;">
        <p class="cms-panel__hint">將種子資料寫入 Supabase，之後首頁會從雲端讀取。</p>

        <div id="loadingIndicator" class="loading-block is-hidden">
          <div class="loading-spinner" aria-hidden="true"></div>
          <p>上傳中…</p>
        </div>

        <div id="uploadStatus"></div>
        <button type="button" id="uploadBtn" class="btn btn-primary">上傳到 Supabase</button>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="index.html" class="brand">SupaBlog</a>
      <p class="site-footer__copy">© 2024 SupaBlog. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
