<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SupaBlog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#00979c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SupaBlog">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../_supabase/supabaseConfig.js" defer></script>
  <script src="js/pwa.js" defer></script>
  <script src="js/index.js" defer></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" class="brand">SupaBlog</a>
      <button type="button" id="mobileMenuBtn" class="nav-toggle" aria-label="開啟選單">☰</button>
      <nav id="navbarNav" class="nav-links" aria-label="主要">
        <button type="button" id="installBtn" class="install-btn" hidden>安裝 App</button>
        <a href="upload.html">管理</a>
      </nav>
    </div>
  </header>
  <p id="installHint" class="install-hint" hidden role="status">若未出現安裝按鈕，請使用瀏覽器選單的「安裝 SupaBlog」</p>

  <main class="site-main">
    <header class="hero-brand">
      <h1 class="hero-brand__name">Fire<span>Blog</span></h1>
      <hr class="divider--light">
      <p class="hero-brand__tag">前端／Supabase／實作</p>
    </header>

    <div class="page-shell">
      <div id="loadingIndicator" class="loading-block">
        <div class="loading-spinner" aria-hidden="true"></div>
        <p>載入文章中…</p>
      </div>
      <div id="blogCardsContainer" class="post-list"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <a href="index.html" class="brand">SupaBlog</a>
      <p class="site-footer__copy">© 2024 SupaBlog. All rights reserved.</p>
    </div>
  </footer>
</body>

</html>
