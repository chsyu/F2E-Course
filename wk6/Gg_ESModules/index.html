<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="utf-8">
	<title>Course List + ES Modules</title>
	<link rel="stylesheet" href="css/style.css">
	<!-- type="module" 預設即為 defer，需透過 Live Server 等 HTTP 伺服器開啟 -->
	<script type="module" src="./js/index.js"></script>
</head>

<body>
	<div class="wrap">
		<header class="header">
			<h1 class="title">課程列表</h1>
			<p class="subtitle">延續 Gf_CourseListTernary：使用 ES Modules（import / export）拆分資料、渲染與主程式</p>
			<label class="search">
				<span class="search__label">搜尋</span>
				<input type="search" id="search" class="search__input" placeholder="例如：JavaScript、排版…">
			</label>
		</header>

		<div id="course-list" class="course-list"></div>
	</div>
