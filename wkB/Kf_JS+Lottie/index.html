<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HelloLottie</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <!-- My stylesheet -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Lottie bodyMovin CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.5.9/lottie.min.js" defer></script>
    <!-- My Script -->
    <script src="./js/script.js" defer></script>

</head>

<body>

    <div class="container">
        <h1 class="title text-center">Lottie Animation</h1>
        <div id="openingLottie" class="openingAnimation"></div>
        <div class="row btn__group">
            <button id="lottie-start" class="btn col btn-primary mx-2 fw-light col-md-4">Lottie Start</button>
            <button id="lottie-pause" class="btn col btn-success mx-2 fw-light col-md-4">Lottie Pause</button>
            <button id="lottie-stop" class="btn col btn-danger mx-2 fw-light col-md-4">Lottie Stop</button>
        </div>
    </div>

</body>

</html>
